# Fast unit tests for workspace packages (excludes monitoring marker; no coverage).
# Installs the monitoring extra so pytest can import *monitoring* modules at collection time.
# Replaces the former price-estimator-tests.yml three-file subset.
name: Unit tests (fast)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  grader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra test --extra monitoring

      # One instrumented app per job: metrics + health tests in the same process are OK.
      - name: Run grader unit tests
        run: uv run pytest grader/tests --no-cov -m "not integration" -v

  price-estimator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra test --extra monitoring

      # One instrumented app per job: metrics + other API tests in the same process are OK.
      - name: Run price estimator unit tests
        run: uv run pytest price_estimator/tests --no-cov -m "not monitoring" -v

  recommender:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra test --extra monitoring

      - name: Run recommender unit tests
        run: uv run pytest recommender/tests --no-cov -m "not monitoring" -v

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra test

      # Explicit path: web/tests is not in root testpaths (avoids multi-app registry).
      # One instrumented app per job.
      - name: Run web metrics tests
        run: uv run pytest web/tests --no-cov -v
